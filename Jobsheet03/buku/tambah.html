<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-MINI | Tambah Buku</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f6f8] text-[#2b2b2b] font-sans leading-relaxed min-h-screen flex flex-col justify-between">
    <header class="bg-[#236c4b] text-white p-4 sm:px-6 flex items-center justify-between flex-wrap shadow-sm">
        <h1 class="text-xl font-bold">SIMPUS-MINI</h1>

        <input type="checkbox" id="menu-toggle" class="peer hidden">
        <label for="menu-toggle" class="md:hidden block cursor-pointer p-1 text-white border border-emerald-600 rounded">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </label>

        <nav class="hidden peer-checked:block w-full md:block md:w-auto mt-3 md:mt-0">
            <ul class="flex flex-col md:flex-row gap-2 md:gap-5 font-medium text-sm">
                <li><a href="../index.html" class="text-white hover:underline block py-1">Beranda</a></li>
                <li><a href="list.html" class="text-white hover:underline block py-1">Daftar Buku</a></li>
                <li><a href="tambah.html" class="text-white hover:underline block py-1 font-bold">Tambah Buku</a></li>
                <li><a href="../anggota/list.html" class="text-white hover:underline block py-1">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html" class="text-white hover:underline block py-1">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main class="max-w-[1000px] mx-auto my-8 px-4 sm:px-6 w-full flex-1">
        <section class="bg-white rounded-lg p-6 shadow-sm">
            <h2 class="text-xl font-bold text-[#236c4b] mb-4">Tambah Buku</h2>
            <form>
                <p class="mb-4">
                    <label for="judul" class="block font-semibold text-[#444] mb-1">Judul</label>
                    <input type="text" id="judul" name="judul" placeholder="isi disini" required
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base">
                </p>
                <p class="mb-4">
                    <label for="pengarang" class="block font-semibold text-[#444] mb-1">Pengarang</label>
                    <input type="text" id="pengarang" name="pengarang" placeholder="isi disini" required
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base">
                </p>
                <p class="mb-4">
                    <label for="tahun" class="block font-semibold text-[#444] mb-1">Tahun</label>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" placeholder="isi disini" required
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base">
                </p>
                <p class="mb-4">
                    <label for="isbn" class="block font-semibold text-[#444] mb-1">ISBN</label>
                    <input type="text" id="isbn" name="isbn" placeholder="isi disini" required
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base">
                </p>
                <p class="mb-4">
                    <label for="stok" class="block font-semibold text-[#444] mb-1">Stok</label>
                    <input type="number" id="stok" name="stok" min="0" placeholder="isi disini" required
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base">
                </p>
                <p class="mb-4">
                    <label for="kategori" class="block font-semibold text-[#444] mb-1">Kategori</label>
                    <select id="kategori" name="kategori"
                            class="w-full max-w-[400px] p-2 border border-[#cdd4da] rounded text-base bg-white">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
                <p class="mt-6">
                    <button type="submit" class="bg-[#236c4b] hover:bg-[#1b5239] text-white py-2.5 px-6 rounded text-base cursor-pointer">
                        Simpan
                    </button>
                </p>
            </form>
        </section>
    </main>

    <footer class="text-center py-5 text-[#7a8794] text-sm">
        <p>&copy; 2026 SIMPUS-MINI &mdash; jobsheet 3</p>
    </footer>
</body>
</html>

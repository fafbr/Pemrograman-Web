            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>

        <nav class="hidden peer-checked:block w-full md:block md:w-auto mt-3 md:mt-0">

    <main class="max-w-[1000px] mx-auto my-8 px-4 sm:px-6 w-full flex-1">
        <section class="bg-white rounded-lg p-6 shadow-sm">
            <h2 class="text-xl font-bold text-[#236c4b] mb-4">Daftar Anggota</h2>
            
            <div class="overflow-x-auto w-full border border-[#e2e6ea] rounded">
                <table class="w-full border-collapse text-left text-sm">
                    <thead class="bg-[#236c4b] text-white">
                        <tr>
                            <th class="p-3 border-b border-[#e2e6ea] whitespace-nowrap">No. Anggota</th>
                            <th class="p-3 border-b border-[#e2e6ea] whitespace-nowrap">Nama</th>
                            <th class="p-3 border-b border-[#e2e6ea] whitespace-nowrap">Alamat</th>

                            <th class="p-3 border-b border-[#e2e6ea] whitespace-nowrap">Tanggal Bergabung</th>
                            <th class="p-3 border-b border-[#e2e6ea] whitespace-nowrap">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-[#e2e6ea]">
                        <tr class="hover:bg-[#edf7f2] transition-colors">
                            <td class="p-3 whitespace-nowrap">A001</td>
                            <td class="p-3 whitespace-nowrap">Siti Aminah</td>
                            <td class="p-3 whitespace-nowrap">Malang</td>
                            <td class="p-3 whitespace-nowrap">0812xxxx</td>
                            <td class="p-3 whitespace-nowrap">2024-08-15</td>
                            <td class="p-3 whitespace-nowrap space-x-1">
                                <button type="button" class="bg-[#f0ad4e] hover:opacity-90 text-white text-xs px-2.5 py-1.5 rounded">Edit</button>
                                <button type="button" class="bg-[#d9534f] hover:opacity-90 text-white text-xs px-2.5 py-1.5 rounded">Hapus</button>
                            </td>
                        </tr>
                        <tr class="bg-[#f7f9fb] hover:bg-[#edf7f2] transition-colors">
                            <td class="p-3 whitespace-nowrap">A002</td>
                            <td class="p-3 whitespace-nowrap">Budi Santoso</td>
                            <td class="p-3 whitespace-nowrap">Batu</td>
                            <td class="p-3 whitespace-nowrap">0813xxxx</td>
                            <td class="p-3 whitespace-nowrap">2025-09-02</td>
                            <td class="p-3 whitespace-nowrap space-x-1">
                                <button type="button" class="bg-[#f0ad4e] hover:opacity-90 text-white text-xs px-2.5 py-1.5 rounded">Edit</button>
                                <button type="button" class="bg-[#d9534f] hover:opacity-90 text-white text-xs px-2.5 py-1.5 rounded">Hapus</button>
                            </td>
                        </tr>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-MINI | Tambah Buku</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50/80 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-emerald-900/95 backdrop-blur-md text-white sticky top-0 z-50 border-b border-emerald-800/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-9 h-9 flex items-center justify-center bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-xl text-white shadow-md shadow-emerald-950/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </span>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white leading-none">SIMPUS<span class="text-emerald-400 font-light">MINI</span></h1>
                    <span class="text-[10px] text-emerald-300/80 font-medium tracking-wider uppercase">Sistem Perpustakaan</span>
                </div>
            </div>

            <button type="button" id="btn-menu" class="md:hidden p-2 rounded-xl text-emerald-200 hover:bg-emerald-800/80 transition active:scale-95">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <nav id="nav-menu" class="hidden w-full md:block md:w-auto mt-4 md:mt-0">
                <ul class="flex flex-col md:flex-row gap-1 md:gap-1.5 font-medium text-sm">
                    <li><a href="../index.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Beranda</a></li>
                    <li><a href="list.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Daftar Buku</a></li>
                    <li><a href="tambah.html" class="block px-3.5 py-2 rounded-xl bg-emerald-800 text-emerald-200 font-semibold shadow-inner">Tambah Buku</a></li>
                    <li><a href="../anggota/list.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Daftar Anggota</a></li>
                    <li><a href="../anggota/tambah.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-10 w-full flex-1">
        <section class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-200/80">
            <div class="border-b border-slate-100 pb-5 mb-6">
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Registrasi Buku Baru</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Lengkapi parameter metadata pustaka untuk didaftarkan ke sistem</p>
            </div>

            <form id="form-buku" class="space-y-5" novalidate>
                <p>
                    <label for="judul" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Judul Buku</label>
                    <input type="text" id="judul" name="judul" placeholder="Contoh: Laskar Pelangi" required
                           class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
                </p>
                
                <p>
                    <label for="pengarang" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama Pengarang / Penulis</label>
                    <input type="text" id="pengarang" name="pengarang" placeholder="Nama lengkap pengarang" required
                           class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
                </p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
                    <p>
                        <label for="tahun" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tahun Terbit</label>
                        <input type="number" id="tahun" name="tahun" min="1900" max="2026" placeholder="YYYY (1900-2026)" required
                               class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
                    </p>
                    <p>
                        <label for="isbn" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nomor ISBN</label>
                        <input type="text" id="isbn" name="isbn" placeholder="978-602-xxx-xxx" required
                               class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
                    </p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
                    <p>
                        <label for="stok" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Kuantitas Stok</label>
                        <input type="number" id="stok" name="stok" min="0" placeholder="Jumlah eksemplar" required
                               class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
                    </p>
                    <p>
                        <label for="kategori" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Kategori Koleksi</label>
                        <select id="kategori" name="kategori"
                                class="w-full px-4 py-2.5 text-sm bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition cursor-pointer">
                            <option value="fiksi">Fiksi</option>
                            <option value="non-fiksi">Non-Fiksi</option>
                            <option value="referensi">Referensi Khusus</option>
                        </select>
                    </p>
                </div>

                <p class="pt-4 flex items-center gap-3">
                    <button type="submit" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-sm shadow-md transition active:scale-95">
                        Simpan Data Koleksi
                    </button>
                    <a href="list.html" class="w-full sm:w-auto text-center px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition">
                        Batal
                    </a>
                </p>
            </form>
        </section>
    </main>

    <footer class="border-t border-slate-200/70 bg-white py-5 text-center text-xs text-slate-400">
        <p>&copy; 2026 SIMPUS-MINI &mdash; jobsheet 5</p>
    </footer>

    <script src="../assets/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Poliklinik - POLIMEDIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">
    <div>
        <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="h-16 flex items-center justify-between">
                    <a href="../index.html" class="flex items-center gap-3 shrink-0">
                        <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-200">S</div>
                        <div>
                            <span class="font-bold text-slate-900 text-lg leading-tight block">POLIMEDIC</span>
                            <span class="text-xs text-slate-500 font-medium">Poliklinik Management</span>
                        </div>
                    </a>

                    <button id="mobile-menu-btn" type="button" class="sm:hidden p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none" aria-label="Toggle Menu">
                        <svg id="menu-icon-open" class="w-6 h-6 block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>

                    <nav class="hidden sm:flex items-center space-x-1">
                        <a href="../index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Dashboard</a>
                        <a href="list.html" class="px-4 py-2 rounded-lg text-sm font-semibold text-indigo-600 bg-indigo-50">Data Poli</a>
                        <a href="../dokter/list.html" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Data Dokter</a>
                    </nav>
                </div>

                <div id="mobile-menu" class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out sm:hidden border-t border-slate-100">
                    <nav class="flex flex-col space-y-1 py-3">
                        <a href="../index.html" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Dashboard</a>
                        <a href="list.html" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-indigo-600 bg-indigo-50">Data Poli</a>
                        <a href="../dokter/list.html" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">Data Dokter</a>
                    </nav>
                </div>
            </div>
        </header>

        <main class="max-w-xl mx-auto px-4 py-10 flex-1 w-full">
            <div class="mb-6">
                <a href="list.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition mb-2">
                    ← Kembali ke Daftar Poli
                </a>
                <h1 class="text-2xl font-bold text-slate-900">Tambah Unit Poliklinik</h1>
                <p class="text-slate-500 text-sm mt-0.5">Masukkan rincian unit dan lokasi ruangan layanan medis baru.</p>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 card-shadow">
                <form data-redirect="list.html" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Nama Poliklinik</label>
                        <input type="text" required placeholder="Contoh: Poli Anak" class="w-full px-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-sm text-slate-800 transition placeholder:text-slate-400">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Lokasi Ruangan</label>
                        <input type="text" required placeholder="Contoh: Lantai 2 - Gedung B" class="w-full px-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 text-sm text-slate-800 transition placeholder:text-slate-400">
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a href="list.html" class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">Batal</a>
                        <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition shadow-sm shadow-indigo-200">Simpan Data</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 font-medium">
            &copy; 2026 POLIMEDIC - Poliklinik Management System. All rights reserved.
        </div>
    </footer>

    <script src="../assets/app.js"></script>
    <script src="../assets/poli.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-MINI | Daftar Buku</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50/80 text-slate-800 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-white">

    <header class="bg-emerald-900/95 backdrop-blur-md text-white sticky top-0 z-50 border-b border-emerald-800/60 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-9 h-9 flex items-center justify-center bg-gradient-to-tr from-emerald-600 to-teal-400 rounded-xl text-white shadow-md shadow-emerald-950/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </span>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white leading-none">SIMPUS<span class="text-emerald-400 font-light">MINI</span></h1>
                    <span class="text-[10px] text-emerald-300/80 font-medium tracking-wider uppercase">Sistem Perpustakaan</span>
                </div>
            </div>

            <button type="button" id="btn-menu" class="md:hidden p-2 rounded-xl text-emerald-200 hover:bg-emerald-800/80 transition active:scale-95">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <nav id="nav-menu" class="hidden w-full md:block md:w-auto mt-4 md:mt-0">
                <ul class="flex flex-col md:flex-row gap-1 md:gap-1.5 font-medium text-sm">
                    <li><a href="../index.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Beranda</a></li>
                    <li><a href="list.html" class="block px-3.5 py-2 rounded-xl bg-emerald-800 text-emerald-200 font-semibold shadow-inner">Daftar Buku</a></li>
                    <li><a href="tambah.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Tambah Buku</a></li>
                    <li><a href="../anggota/list.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Daftar Anggota</a></li>
                    <li><a href="../anggota/tambah.html" class="block px-3.5 py-2 rounded-xl text-emerald-100 hover:bg-emerald-800/60 hover:text-white transition">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 w-full flex-1 space-y-6">
        <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100 pb-5">
                <div>
                    <h2 class="text-2xl font-bold tracking-tight text-slate-900">Koleksi Pustaka</h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Daftar buku fisik dimuat secara asinkron via Fetch API</p>
                </div>
                <a href="tambah.html" class="inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-semibold text-sm shadow-sm transition active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Tambah Koleksi
                </a>
            </div>

            <div class="w-full sm:max-w-xs">
                <input type="text" id="input-cari" placeholder="Cari buku realtime..." 
                        class="w-full px-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/30 focus:border-emerald-600 transition">
            </div>

            <div class="overflow-x-auto w-full border border-slate-200/90 rounded-2xl shadow-inner">
                <table class="w-full border-collapse text-left text-sm">
                    <thead class="bg-slate-50/90 text-slate-600 border-b border-slate-200 text-xs font-bold uppercase tracking-wider">
                        <tr>
                            <th class="py-4 px-5 whitespace-nowrap">Judul Buku</th>
                            <th class="py-4 px-5 whitespace-nowrap">Pengarang</th>
                            <th class="py-4 px-5 whitespace-nowrap">Tahun</th>
                            <th class="py-4 px-5 whitespace-nowrap">Stok</th>
                            <th class="py-4 px-5 whitespace-nowrap text-center">Aksi Manajemen</th>
                        </tr>
                    </thead>

                    <tbody id="buku-tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-200/70 bg-white py-5 text-center text-xs text-slate-400">
        <p>&copy; 2026 SIMPUS-MINI &mdash; jobsheet 6</p>
    </footer>

    <script src="../assets/app.js"></script>
    <script src="../assets/buku.js"></script>
</body>
</html>
